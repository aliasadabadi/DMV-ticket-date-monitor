name: Check DMV ticket dates

on:
  workflow_dispatch:

concurrency:
  group: odyssey-ticket-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Firefox
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-1.54.0

      - name: Install Python packages
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Install Firefox
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps firefox

      - name: Check ticket schedule
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python check_tickets.py

      - name: Save latest schedule
        run: |
          if [ ! -f ticket_state.json ]; then
            echo "No ticket_state.json file was created."
            exit 0
          fi

          git config user.name "DMV Ticket Monitor"
          git config user.email "actions@github.com"

          cp ticket_state.json /tmp/ticket_state.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/ticket_state.json ticket_state.json
          git add ticket_state.json

          if git diff --cached --quiet; then
            echo "No schedule changes to save."
            exit 0
          fi

          git commit -m "Update ticket schedule state"
          git push origin main
